# CodeRabbit configuration (free on public repositories)
# Docs: https://docs.coderabbit.ai/

language: "fa-IR"   # ترجیح نظرات به فارسی در صورت پشتیبانی

reviews:
  profile: "chill"           # یا assertive برای سخت‌گیری بیشتر
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - "feat/.*"
      - "fix/.*"
      - "chore/.*"

# مسیرهایی که معمولاً نیاز به بازبینی عمیق‌تر دارند
path_filters:
  - "!**/node_modules/**"
  - "!**/bin/**"
  - "!**/obj/**"
  - "!**/wwwroot/lib/**"
  - "!third_party/**"

# دستورالعمل اختصاصی برای این پروژه
knowledge_base:
  learnings:
    - "این پروژه Clean Architecture با Multi-Tenancy است. هرگز به TenantId ارسالی کلاینت اعتماد نکن."
    - "Vendor و دیتابیس حسابداری مشتری جدا هستند. Migration مشتری را در PRهای Vendor تغییر نده."
    - "کلید خصوصی لایسنس و Provisioning هرگز نباید در کد یا config باشد (fail-closed)."
    - "فرانت‌اند React باید RTL فارسی و دارایی‌های محلی داشته باشد (بدون CDN)."
    - "هر mutation نیاز به Anti-forgery و مجوز سمت سرور دارد."
