name: Generate customer provisioning migration (temporary)

on:
  push:
    branches:
      - feat/customer-provisioning-consumer
    paths:
      - '.github/workflows/generate-customer-provisioning-migration.yml'
      - 'Domain/ProvisioningRequestClaim.cs'
      - 'Infrastructure/Persistence/Configurations/ProvisioningRequestClaimConfiguration.cs'
      - 'Infrastructure/Persistence/DatabaseContext.cs'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.402
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install migration verifier parser
        run: python3 -m pip install --disable-pip-version-check tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.1
      - name: Restore and build model
        run: |
          dotnet restore Server/Server.csproj
          dotnet build Server/Server.csproj --no-restore --configuration Release
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.13
      - name: Generate table migration with EF Core
        run: dotnet ef migrations add AddCustomerProvisioningClaims --project Infrastructure/Persistence/Infrastructure.Persistence.csproj --startup-project Server/Server.csproj --configuration Release --output-dir Migrations --namespace Data.Migrations
      - name: Advance migration generator to generated ID and render snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          migrations = Path("Infrastructure/Persistence/Migrations")
          candidates = sorted(migrations.glob("*_AddCustomerProvisioningClaims.cs"))
          if len(candidates) != 1:
              raise SystemExit(f"expected one generated migration, found {len(candidates)}")
          migration_id = candidates[0].name.split("_", 1)[0]
          script = Path("scripts/generate_migrations.py")
          source = script.read_text(encoding="utf-8-sig")
          source, count = re.subn(r'CURRENT_MIGRATION_ID = "[0-9]+"', f'CURRENT_MIGRATION_ID = "{migration_id}"', source, count=1)
          if count != 1:
              raise SystemExit("could not update CURRENT_MIGRATION_ID")
          script.write_text(source, encoding="utf-8")
          print(f"Using generated migration ID {migration_id}")
          PY
          python3 scripts/generate_migrations.py --repo-root .
          python3 scripts/verify_migration_model.py --repo-root .
      - name: Commit verified migration files to this feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Infrastructure/Persistence/Migrations/*_AddCustomerProvisioningClaims.cs
          git add Infrastructure/Persistence/Migrations/*_AddCustomerProvisioningClaims.Designer.cs
          git add Infrastructure/Persistence/Migrations/DatabaseContextModelSnapshot.cs scripts/generate_migrations.py
          git commit -m "feat(database): add verified customer provisioning claims migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload generated migration files
        uses: actions/upload-artifact@v7
        with:
          name: customer-provisioning-migration
          path: |
            Infrastructure/Persistence/Migrations/*_AddCustomerProvisioningClaims.cs
            Infrastructure/Persistence/Migrations/*_AddCustomerProvisioningClaims.Designer.cs
            Infrastructure/Persistence/Migrations/DatabaseContextModelSnapshot.cs
          if-no-files-found: error
