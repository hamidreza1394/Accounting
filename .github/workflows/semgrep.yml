name: Semgrep (free static analysis)

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full scan (Sunday 03:00 UTC)
    - cron: "0 3 * * 0"

permissions:
  contents: read
  security-events: write   # for uploading findings if supported
  pull-requests: write

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=auto \
            --sarif \
            --output=semgrep.sarif \
            --error \
            --metrics=off \
            --exclude=node_modules \
            --exclude=**/bin \
            --exclude=**/obj \
            --exclude=**/wwwroot \
            --exclude=third_party \
            .

      - name: Upload SARIF (optional – works best with code scanning enabled)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
