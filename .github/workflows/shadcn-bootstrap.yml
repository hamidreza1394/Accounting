name: shadcn bootstrap (temporary)

on:
  push:
    branches:
      - feat/issue-122-shadcn-install

permissions:
  contents: write

concurrency:
  group: shadcn-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClientApp
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json
      - name: Install required component primitives and utilities
        run: npm install @base-ui/react class-variance-authority clsx tailwind-merge lucide-react --no-audit --no-fund
      - name: Generate official shadcn components
        run: npx --yes shadcn@latest add button card --yes
      - name: Resolve and lock generated dependencies
        run: npm install --no-audit --no-fund
      - name: Clean locked install
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify offline assets
        run: npm run check:offline
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Commit generated source and lockfile
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ClientApp/package.json ClientApp/package-lock.json ClientApp/src/components/ui ClientApp/src/lib
          if git diff --cached --quiet; then
            echo "No generated source or lockfile changes to commit."
            exit 0
          fi
          git commit -m "feat(ui): install shadcn components and lock dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
