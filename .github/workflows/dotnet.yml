name: .NET CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The React client (ClientApp): locked install, strict type check, unit tests,
  # production build, the offline-resources check of the build output and an audit
  # of the runtime dependencies. Node 24 ships npm 11, which the lockfile needs.
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json
      - name: Install (locked)
        run: npm ci --no-fund --no-audit
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Check that the build needs no internet resource
        run: npm run check:offline
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  build-and-test:
    runs-on: ubuntu-latest
    # A disposable SQL Server for the HTTP integration tests (tests/Template.Tests/Integration).
    # The sa password only exists inside this throw-away container of one CI run.
    env:
      MSSQL_SA_PASSWORD: Ci1Faranou${{ github.run_id }}x
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci1Faranou${{ github.run_id }}x
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci1Faranou${{ github.run_id }}x -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check local-only static assets
        run: python3 scripts/check_static_assets.py
      - name: Restore
        run: dotnet restore Template.sln
      - name: Build
        run: dotnet build Template.sln --no-restore --configuration Release
      - name: Test
        env:
          # Runs the integration tests against the SQL Server container above (real SQL Server,
          # schema from the EF Core migrations). The database is created and dropped by the tests.
          FARANOU_TEST_SQLSERVER: Server=localhost,1433;Database=FaranouTests;User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True
          FARANOU_REQUIRE_SQLSERVER: '1'
        run: |
          set -o pipefail
          dotnet test Template.sln --no-build --configuration Release 2>&1 | tee /tmp/dotnet-test.log
      - name: Report the test totals
        if: always()
        run: |
          totals="$(grep -aE 'total: |failed: |succeeded: |skipped: |Test run summary' /tmp/dotnet-test.log | tr -d '\r' | tr '\n' ' ' || true)"
          echo "::notice title=.NET test totals::${totals:-no summary found}"
      # Behavioral (DOM-level) tests for client-side scripts. The xUnit tests only
      # inspect the .cshtml/.js source as text; these tests render the form in jsdom,
      # load the real taraz-login.js + site.js, and assert that clicking the password
      # toggle actually flips password.type between "password" and "text".
      - name: Behavioral tests (jsdom)
        working-directory: tests/Template.Tests.Js
        run: |
          set -o pipefail
          npm install --no-fund --no-audit 2>&1 | tee /tmp/npm-install.log
          node --test 2>&1 | tee /tmp/behavioral-test.log
      # The migration checks are the guards against a model snapshot that no longer
      # describes the model, which fails at runtime with PendingModelChangesWarning.
      - name: Check the generated migrations
        run: python3 scripts/generate_migrations.py --repo-root . --check
      - name: Install the C# parser of the migration verification
        run: python3 -m pip install --disable-pip-version-check tree-sitter tree-sitter-c-sharp
      - name: Verify the migration and the model snapshot
        run: python3 scripts/verify_migration_model.py --repo-root .
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.13
      # The official check. It builds the model and compares it with the snapshot; it
      # never opens a database connection. "--no-build" reuses the output of the build
      # step, so it has to ask for the same configuration.
      - name: Check for pending model changes
        run: |
          set -o pipefail
          dotnet ef migrations has-pending-model-changes --project Infrastructure/Persistence/Infrastructure.Persistence.csproj --startup-project Server/Server.csproj --configuration Release --no-build 2>&1 | tee /tmp/dotnet-ef.log
      # The logs of a run can not always be downloaded, so the failure details are
      # published where they stay readable. This step runs last, so that every log that
      # exists is published.
      - name: Publish the failure details
        if: failure()
        run: |
          for log in /tmp/dotnet-test.log /tmp/dotnet-ef.log /tmp/behavioral-test.log /tmp/npm-install.log; do
            if [ -f "$log" ]; then
              {
                echo "### $(basename "$log")"
                echo ''
                echo '```'
                tail -n 250 "$log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          # The step summary is not readable through the API, the annotation is.
          for log in /tmp/dotnet-test.log /tmp/dotnet-ef.log /tmp/behavioral-test.log /tmp/npm-install.log; do
            if [ -f "$log" ]; then
              echo "::error title=$(basename "$log")::$(tail -n 120 "$log" | grep -a -E 'error|Failed|failed|Assert|Exception|Test summary|total:|Passed!|Failed!|Unable|not found|pending|not ok' | head -n 40 | tr -d '\r' | tr '\n' '~')"
            fi
          done

  # Production build in the documented order (scripts/publish.sh: npm ci, client type check and
  # tests, npm run build, offline check, dotnet publish, checks of the publish output), then the
  # published server is started and /app, its client routes and bundles are requested over HTTP.
  publish:
    runs-on: ubuntu-latest
    needs: [client, build-and-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json
      - name: Publish (client build + server publish + output checks)
        run: scripts/publish.sh "$RUNNER_TEMP/faranou-publish"
      - name: Smoke test of the published server
        run: scripts/smoke-published-app.sh "$RUNNER_TEMP/faranou-publish"
      - name: List the published client
        if: always()
        run: find "$RUNNER_TEMP/faranou-publish/wwwroot/app" -type f | sort || true
