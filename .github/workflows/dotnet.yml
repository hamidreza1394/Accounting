name: .NET CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dotnet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # G3 (D-041): secret scanning. Pinned to full commit SHA of gitleaks/gitleaks-action v3.0.0.
  # https://github.com/gitleaks/gitleaks-action/releases/tag/v3.0.0
  # commit e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e (Node 24 runtime)
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json
      - name: Install (locked)
        run: npm ci --no-fund --no-audit
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Check that the build needs no internet resource
        run: npm run check:offline
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  build-and-test:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    env:
      MSSQL_SA_PASSWORD: Ci1Faranou${{ github.run_id }}x
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci1Faranou${{ github.run_id }}x
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci1Faranou${{ github.run_id }}x -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check local-only static assets
        run: python3 scripts/check_static_assets.py
      - name: Restore
        run: dotnet restore Template.sln
      - name: Build
        run: dotnet build Template.sln --no-restore --configuration Release
      - name: Test
        env:
          FARANOU_TEST_SQLSERVER: Server=localhost,1433;Database=FaranouTests;User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=True
          FARANOU_REQUIRE_SQLSERVER: '1'
        run: |
          set -o pipefail
          dotnet test Template.sln --no-build --configuration Release 2>&1 | tee /tmp/dotnet-test.log
      - name: Report vulnerable NuGet packages (direct and transitive)
        run: |
          set -o pipefail
          dotnet list Template.sln package --vulnerable --include-transitive 2>&1 | tee /tmp/nuget-vulnerable.log
          if grep -qiE 'has the following vulnerable packages' /tmp/nuget-vulnerable.log; then
            echo "::error title=Vulnerable NuGet packages::see the step log"; exit 1
          fi
          echo "::notice title=NuGet vulnerability scan::no vulnerable package reported"
      - name: Report the failing tests
        if: failure()
        run: |
          sed -e 's/\x1b\[[0-9;]*m//g' -e 's/\r//g' /tmp/dotnet-test.log > /tmp/dotnet-test.clean.log
          grep -nE '^\s*(failed|\[FAIL\])\s' /tmp/dotnet-test.clean.log | head -n 20 | while IFS= read -r line; do
            echo "::error title=Failed test::$line"
          done
          first="$(grep -nE '^\s*(failed|\[FAIL\])\s' /tmp/dotnet-test.clean.log | head -n 1 | cut -d: -f1)"
          if [ -n "$first" ]; then
            echo "::error title=First failure details::$(sed -n "${first},$((first + 40))p" /tmp/dotnet-test.clean.log | tr '\n' '~' | cut -c1-6000)"
          fi
      - name: Report the test totals
        if: always()
        run: |
          totals="$(grep -aE 'total: |failed: |succeeded: |skipped: |Test run summary' /tmp/dotnet-test.log | tr -d '\r' | tr '\n' ' ' || true)"
          echo "::notice title=.NET test totals::${totals:-no summary found}"
      - name: Behavioral tests (jsdom)
        working-directory: tests/Template.Tests.Js
        run: |
          set -o pipefail
          npm install --no-fund --no-audit 2>&1 | tee /tmp/npm-install.log
          node --test 2>&1 | tee /tmp/behavioral-test.log
      - name: Check the generated migrations
        run: python3 scripts/generate_migrations.py --repo-root . --check
      - name: Install the C# parser of the migration verification
        run: python3 -m pip install --disable-pip-version-check tree-sitter tree-sitter-c-sharp
      - name: Test the migration guards (unit and mutation tests)
        run: |
          python3 scripts/tests/test_migration_tooling.py
          python3 scripts/tests/test_migration_guard_mutations.py
      - name: Verify the migration and the model snapshot
        run: python3 scripts/verify_migration_model.py --repo-root .
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.13
      - name: Check for pending model changes
        run: |
          set -o pipefail
          dotnet ef migrations has-pending-model-changes --project Infrastructure/Persistence/Infrastructure.Persistence.csproj --startup-project Server/Server.csproj --configuration Release --no-build 2>&1 | tee /tmp/dotnet-ef.log
      - name: Publish the failure details
        if: failure()
        run: |
          for log in /tmp/dotnet-test.log /tmp/dotnet-ef.log /tmp/behavioral-test.log /tmp/npm-install.log; do
            if [ -f "$log" ]; then
              {
                echo "### $(basename "$log")"
                echo ''
                echo '```'
                tail -n 250 "$log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          for log in /tmp/dotnet-test.log /tmp/dotnet-ef.log /tmp/behavioral-test.log /tmp/npm-install.log; do
            if [ -f "$log" ]; then
              echo "::error title=$(basename "$log")::$(tail -n 120 "$log" | grep -a -E 'error|Failed|failed|Assert|Exception|Test summary|total:|Passed!|Failed!|Unable|not found|pending|not ok' | head -n 40 | tr -d '\r' | tr '\n' '~')"
            fi
          done

  publish-scripts:
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Scripts started directly by a workflow are executable (100755)
        run: python3 scripts/tests/check_workflow_script_modes.py
      - name: Bash guard tests (output directory)
        run: scripts/tests/publish-output.test.sh
      - name: Bash G2 content guard tests
        run: bash scripts/tests/publish-content-guard.test.sh
      - name: PowerShell guard tests (PowerShell 7 on Linux)
        shell: pwsh
        run: ./scripts/tests/publish-output.tests.ps1
      - name: Lint the developer scripts
        run: |
          bash -n scripts/dev/*.sh
          shellcheck -S style scripts/dev/*.sh
      - name: Resolve the SDK version of global.json (no install)
        run: |
          rc=0; scripts/dev/install-dotnet.sh --check || rc=$?
          [ "$rc" = 0 ] || [ "$rc" = 3 ]

  publish-windows:
    runs-on: windows-latest
    needs: [client, build-and-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json
      - name: PowerShell guard tests (Windows)
        shell: pwsh
        run: ./scripts/tests/publish-output.tests.ps1
      - name: Licensing contract tests (Windows)
        shell: pwsh
        run: dotnet test tests/Licensing.Contracts.Tests/Licensing.Contracts.Tests.csproj --configuration Release
      - name: Publish with scripts/publish.ps1
        shell: pwsh
        run: ./scripts/publish.ps1 -Output (Join-Path $env:RUNNER_TEMP 'faranou-publish')
      - name: Check the Windows publish output
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'faranou-publish'
          foreach ($path in 'Server.dll', 'wwwroot/app/index.html', 'wwwroot/fonts/woff2/IRANSansX-Regular.woff2', '.faranou-publish-output') {
            if (-not (Test-Path (Join-Path $out $path))) { throw "missing $path" }
            Write-Host "present: $path"
          }

  publish:
    runs-on: ubuntu-latest
    needs: [client, build-and-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json
      - name: Publish (client build + server publish + output checks + G2)
        run: scripts/publish.sh "$RUNNER_TEMP/faranou-publish"
      - name: Smoke test of the published server
        run: scripts/smoke-published-app.sh "$RUNNER_TEMP/faranou-publish"
      - name: List the published client
        if: always()
        run: find "$RUNNER_TEMP/faranou-publish/wwwroot/app" -type f | sort || true

  e2e:
    runs-on: ubuntu-latest
    needs: [client, build-and-test]
    env:
      MSSQL_SA_PASSWORD: Ci1Faranou${{ github.run_id }}e2e
      FARANOU_E2E_SQL: Server=localhost,1433;Database=FaranouE2E;User Id=sa;Password=Ci1Faranou${{ github.run_id }}e2e;TrustServerCertificate=True;Encrypt=True
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci1Faranou${{ github.run_id }}e2e
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Ci1Faranou${{ github.run_id }}e2e -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Publish
        run: scripts/publish.sh "$RUNNER_TEMP/faranou-publish"
      - name: Create the database schema (migrations of the published server)
        run: ConnectionStrings__ConnectionString="$FARANOU_E2E_SQL" dotnet "$RUNNER_TEMP/faranou-publish/Server.dll" --migrate
      - name: Install the E2E tools
        working-directory: tests/e2e
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Seed accounts and companies
        working-directory: tests/e2e
        run: npm run seed
      - name: Check that both server variants start
        working-directory: tests/e2e
        env:
          FARANOU_E2E_PUBLISH: ${{ runner.temp }}/faranou-publish
        run: ./check-servers.sh
      - name: Browser tests
        working-directory: tests/e2e
        env:
          FARANOU_E2E_PUBLISH: ${{ runner.temp }}/faranou-publish
        run: npx playwright test
      - name: Report the E2E result
        if: always()
        working-directory: tests/e2e
        run: |
          if [ -d playwright-report ]; then echo "::notice title=E2E::report saved as artifact e2e-report"; fi
      - name: Keep the E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
