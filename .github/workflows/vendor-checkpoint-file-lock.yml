name: Vendor checkpoint file-lock tests

on:
  pull_request:
    paths:
      - "Vendor/Vendor.Persistence/Auditing/DevelopmentFileVendorAuditCheckpointStore.cs"
      - "tests/Vendor.Host.Tests/DevelopmentFileVendorAuditCheckpointStoreTests.cs"
      - "tests/Vendor.Host.Tests/Vendor.Host.Tests.csproj"
      - "tests/Vendor.CheckpointProcessHelper/**"
      - ".github/workflows/vendor-checkpoint-file-lock.yml"
  push:
    branches: [main]
    paths:
      - "Vendor/Vendor.Persistence/Auditing/DevelopmentFileVendorAuditCheckpointStore.cs"
      - "tests/Vendor.Host.Tests/DevelopmentFileVendorAuditCheckpointStoreTests.cs"
      - "tests/Vendor.Host.Tests/Vendor.Host.Tests.csproj"
      - "tests/Vendor.CheckpointProcessHelper/**"
      - ".github/workflows/vendor-checkpoint-file-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-process:
    name: ${{ matrix.os }} checkpoint lock
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore focused test project
        run: dotnet restore tests/Vendor.Host.Tests/Vendor.Host.Tests.csproj

      - name: Run cross-process checkpoint tests
        run: dotnet test tests/Vendor.Host.Tests/Vendor.Host.Tests.csproj --configuration Release --no-restore --filter "FullyQualifiedName~DevelopmentFileVendorAuditCheckpointStoreTests" --verbosity minimal
