version: 2
updates:
  # .NET / NuGet (solution root)
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "deps(nuget)"

  # React / ClientApp
  - package-ecosystem: npm
    directory: "/ClientApp"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
      - "frontend"
    commit-message:
      prefix: "deps(npm)"

  # React / Vendor.Web (Vendor control plane)
  - package-ecosystem: npm
    directory: "/Vendor/Vendor.Web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
      - "vendor"
    commit-message:
      prefix: "deps(vendor-npm)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(actions)"
