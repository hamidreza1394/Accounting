<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Faranou">
  <title>Faranou</title>
  <!-- Flat vector mark derived from the official Faranou logo: navy F, gold bar chart,
       teal rising line with gold arrow, and the Persian letter feh with its gold dot. -->
  <g>
    <!-- gold bar chart -->
    <g fill="#E0A94A">
      <rect x="20.5" y="27" width="6" height="14" rx="2"/>
      <rect x="29" y="20" width="6" height="21" rx="2"/>
      <rect x="37.5" y="13" width="6" height="28" rx="2"/>
    </g>
    <!-- teal rising chart line -->
    <path d="M7 50 L17 41 L27 46 L38 36" fill="none" stroke="#2F8D93" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- gold arrow: shaft and head -->
    <path d="M38 36 L51.5 18.5" fill="none" stroke="#E0A94A" stroke-width="6.5" stroke-linecap="round"/>
    <polygon points="58,11 55,23 46,15.5" fill="#E0A94A"/>
    <!-- navy F -->
    <g fill="#1C3D5A">
      <rect x="7" y="7" width="11" height="49" rx="3"/>
      <rect x="7" y="7" width="27" height="11" rx="3"/>
      <rect x="7" y="25" width="21" height="10" rx="3"/>
    </g>
    <!-- Persian feh: bowl with tail sweeping left -->
    <path d="M48 43 v3 a9 9 0 0 1 -18 0 C29 51 20 57 9 57" fill="none" stroke="#1C3D5A" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- feh dot -->
    <rect x="44.5" y="35" width="6" height="6" rx="1.4" fill="#E0A94A"/>
  </g>
</svg>
