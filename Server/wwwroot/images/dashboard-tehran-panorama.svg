<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="360" viewBox="0 0 2700 360" role="img" aria-labelledby="title desc">
<title id="title">چشم‌انداز روشن تهران با برج میلاد</title>
<desc id="desc">تصویرسازی پانورامای رنگی از برج میلاد با سازهٔ شاخص، خط آسمان تهران، کوه‌های البرز و آسمان روشن فیروزه‌ای و طلایی</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8de8f3"/><stop offset=".48" stop-color="#d5f5f4"/><stop offset="1" stop-color="#fff0d7"/></linearGradient>
  <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf0"/><stop offset=".45" stop-color="#b4dfe2"/><stop offset="1" stop-color="#76b9c8"/></linearGradient>
  <linearGradient id="city" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3d9dbb"/><stop offset="1" stop-color="#22628e"/></linearGradient>
  <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f8ffff"/><stop offset=".3" stop-color="#a9e6ed"/><stop offset=".62" stop-color="#ffffff"/><stop offset="1" stop-color="#69b8d0"/></linearGradient>
  <linearGradient id="towerHead" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#8bd9e8"/><stop offset="1" stop-color="#4b9fc0"/></linearGradient>
  <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f6c76c" stop-opacity="0"/><stop offset=".5" stop-color="#f6c76c" stop-opacity=".34"/><stop offset="1" stop-color="#f6c76c" stop-opacity="0"/></linearGradient>
  <pattern id="windows" width="22" height="18" patternUnits="userSpaceOnUse"><rect x="5" y="4" width="4" height="7" rx="1" fill="#d9f8ff" opacity=".7"/><rect x="14" y="4" width="4" height="7" rx="1" fill="#fce5b8" opacity=".6"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
